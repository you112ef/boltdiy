<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoltDIY - Agent Platform المتقدمة</title>
    <meta name="description" content="منصة الذكاء الاصطناعي الشاملة مع نظام إدارة الوكلاء المتقدم">
    <meta name="theme-color" content="#1f2937">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%234F46E5'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='white' font-size='16' font-weight='bold'%3EBD%3C/text%3E%3C/svg%3E">
    
    <!-- External CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
</head>
<body class="bg-gray-900 text-white antialiased">
    <!-- Header -->
    <header class="bg-gray-800 shadow-lg border-b border-gray-700">
        <div class="flex items-center justify-between p-2 max-w-full">
            <div class="flex items-center gap-2">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%234F46E5'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='white' font-size='16' font-weight='bold'%3EBD%3C/text%3E%3C/svg%3E" alt="BoltDIY" class="w-6 h-6">
                <h1 class="text-lg font-bold text-white hidden sm:block">BoltDIY Agent Platform</h1>
            </div>

            <div class="flex items-center gap-2">
                <div id="agent-status" class="bg-gray-700 px-2 py-1 rounded text-xs hidden sm:block">
                    <span class="agent-indicator">🤖</span>
                    <span class="agent-name">جاهز</span>
                </div>
                <button id="settings-btn" class="p-2 hover:bg-gray-700 rounded">
                    <i class="fas fa-cog text-gray-300"></i>
                </button>
                <button id="toggle-sidebar" class="p-2 hover:bg-gray-700 rounded lg:hidden">
                    <i class="fas fa-bars text-gray-300"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex h-[calc(100vh-64px)] overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-gray-800 border-r border-gray-700 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 fixed lg:relative z-30 h-full overflow-y-auto">
            <!-- File Explorer -->
            <div class="p-3 border-b border-gray-700">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-medium text-gray-300">الملفات</h3>
                    <button id="new-file-btn" class="text-xs bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded">
                        <i class="fas fa-plus mr-1"></i>جديد
                    </button>
                </div>
                <div id="file-tree" class="text-sm">
                    <!-- سيتم ملؤها بـ JavaScript -->
                </div>
            </div>

            <!-- Agent Context -->
            <div id="agent-context" class="p-3 border-b border-gray-700">
                <h3 class="text-sm font-medium text-gray-300 mb-2">سياق الوكيل</h3>
                <!-- سيتم ملؤها بـ JavaScript -->
            </div>

            <!-- Tools & Actions -->
            <div class="p-3">
                <h3 class="text-sm font-medium text-gray-300 mb-2">الأدوات</h3>
                <div class="space-y-1">
                    <button class="w-full text-left text-xs p-2 hover:bg-gray-700 rounded">
                        <i class="fas fa-search mr-2"></i>بحث دلالي (Ctrl+K)
                    </button>
                    <button class="w-full text-left text-xs p-2 hover:bg-gray-700 rounded">
                        <i class="fas fa-terminal mr-2"></i>المحطة الطرفية
                    </button>
                    <button class="w-full text-left text-xs p-2 hover:bg-gray-700 rounded">
                        <i class="fas fa-camera mr-2"></i>OCR - تحليل الصور
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Monaco Editor Container -->
            <div class="flex-1 relative">
                <div id="monaco-container" class="w-full h-full">
                    <!-- سيتم تحميل Monaco Editor هنا -->
                </div>
            </div>

            <!-- Terminal -->
            <div id="terminal-container" class="h-48 bg-black border-t border-gray-700 hidden">
                <div class="flex items-center justify-between bg-gray-800 px-3 py-1 border-b border-gray-700">
                    <span class="text-xs text-gray-300">المحطة الطرفية</span>
                    <button id="toggle-terminal" class="text-xs text-gray-400 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="terminal" class="h-full">
                    <!-- سيتم تحميل xterm.js هنا -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Agent Input -->
    <div class="fixed bottom-4 right-4 w-80 max-w-[calc(100vw-2rem)]">
        <div class="bg-gray-800 rounded-lg shadow-xl border border-gray-700">
            <div class="flex items-center justify-between p-3 border-b border-gray-700">
                <span class="text-sm font-medium text-white">🤖 مساعد الذكاء الاصطناعي</span>
                <button id="minimize-ai" class="text-gray-400 hover:text-white">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
            <div class="p-3">
                <textarea id="agent-input" placeholder="اسأل الوكيل الذكي..." class="w-full bg-gray-700 text-white placeholder-gray-400 border border-gray-600 rounded p-2 text-sm resize-none focus:outline-none focus:border-blue-500" rows="2"></textarea>
                <div class="flex items-center justify-between mt-2">
                    <div class="flex gap-1">
                        <span class="text-xs text-gray-500">اضغط Enter للإرسال</span>
                    </div>
                    <button id="send-agent" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs">
                        إرسال
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-20">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-2xl mx-4">
            <div class="p-4 border-b border-gray-700">
                <div class="flex items-center gap-3">
                    <i class="fas fa-search text-gray-400"></i>
                    <input id="search-input" type="text" placeholder="البحث الدلالي..." class="flex-1 bg-transparent text-white placeholder-gray-400 outline-none">
                    <button id="close-search" class="text-gray-400 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div id="search-results" class="max-h-96 overflow-y-auto">
                <!-- نتائج البحث -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="p-4 border-b border-gray-700">
                <h3 class="text-lg font-semibold text-white">الإعدادات</h3>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">مفتاح OpenAI API</label>
                    <input id="openai-key" type="password" placeholder="sk-..." class="w-full bg-gray-700 text-white placeholder-gray-400 border border-gray-600 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">مفتاح Anthropic API</label>
                    <input id="anthropic-key" type="password" placeholder="sk-ant-..." class="w-full bg-gray-700 text-white placeholder-gray-400 border border-gray-600 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">مفتاح Google AI API</label>
                    <input id="google-key" type="password" placeholder="AIza..." class="w-full bg-gray-700 text-white placeholder-gray-400 border border-gray-600 rounded p-2 text-sm">
                </div>
            </div>
            <div class="p-4 border-t border-gray-700 flex justify-end gap-2">
                <button id="cancel-settings" class="px-4 py-2 text-gray-300 hover:text-white">إلغاء</button>
                <button id="save-settings" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded">حفظ</button>
            </div>
        </div>
    </div>

    <!-- OCR Modal -->
    <div id="ocr-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-2xl mx-4">
            <div class="p-4 border-b border-gray-700">
                <h3 class="text-lg font-semibold text-white">تحليل الصور (OCR)</h3>
            </div>
            <div class="p-4">
                <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center">
                    <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4"></i>
                    <p class="text-gray-300 mb-2">اسحب الصورة هنا أو انقر للاختيار</p>
                    <p class="text-sm text-gray-500">PNG, JPG, GIF - حتى 10MB</p>
                    <input id="file-input" type="file" accept="image/*" class="hidden">
                </div>
                <div id="ocr-results" class="mt-4 hidden">
                    <!-- نتائج OCR -->
                </div>
            </div>
            <div class="p-4 border-t border-gray-700 flex justify-end gap-2">
                <button id="close-ocr" class="px-4 py-2 text-gray-300 hover:text-white">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm"></div>

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="https://unpkg.com/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/yjs@13.6.10/dist/yjs.umd.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="/js/unified-ai-api.js" defer></script>
    <script src="/js/agent-tools.js" defer></script>
    <script src="/js/agent-manager.js" defer></script>
    <script src="/js/admin-dashboard.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/monaco-setup.js" defer></script>
    <script src="/js/semantic-search.js" defer></script>
    <script src="/js/ocr-handler.js" defer></script>
    <script src="/js/terminal.js" defer></script>
    <script src="/js/ai-agent.js" defer></script>
    <script src="/js/mobile-handlers.js" defer></script>
</body>
</html>
